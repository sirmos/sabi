services:
  - type: web
    name: sabi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SABI_MODE
        value: live
      - key: SABI_PROVIDER
        value: meta
      - key: MODEL_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
